# Calls the shared PR flow in LukeNeedham/ci-workflows: builds the debug APK on every PR push,
# comments the download link, and deletes the PR's builds when it closes.
# Setup guide: https://github.com/LukeNeedham/ci-workflows/blob/main/docs/setup.md
name: On Pull Request

on:
  workflow_dispatch: {}
  pull_request:
    # `closed` runs the release cleanup, the other types run the build. Keep all four.
    types: [opened, reopened, synchronize, closed]
    branches:
      - main

permissions:
  contents: write       # create the release that holds the APK, and delete it again
  pull-requests: write  # post the sticky comment

jobs:
  android:
    uses: LukeNeedham/ci-workflows/.github/workflows/android_pr.yml@main
    with:
      apk-path: app/build/outputs/apk/debug/app-debug.apk

  # Runs the JVM unit tests, which include NoDestructiveMigrationTest (see docs/database.md).
  # Separate from the build above so a failing test is its own red check on the PR.
  unit-tests:
    # `closed` only runs the shared flow's cleanup.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest
